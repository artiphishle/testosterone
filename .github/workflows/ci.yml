name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Apply branch maintenance
        if: github.event_name == 'push' && github.ref_name == 'feat/16-ankhorage-test-migration'
        run: |
          rm -f bun.lock
          bun install
          bun run format
          bun run lint:fix || true
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore(repo): apply Ankhorage formatting and lockfile"
            git push
          fi

      - name: Run build
        run: bun run build

      - name: Run typecheck
        run: bun run typecheck

      - name: Run lint
        run: bun run lint

      - name: Run format check
        run: bun run format:check

      - name: Run Knip
        run: bun run knip:check

      - name: Run tests
        run: bun run test

      - name: Run standalone contract
        run: bun run test:standalone

      - name: Check changesets
        if: github.event_name == 'pull_request'
        run: bun run changeset:status
